<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hors connexion — Mon Livreur Pro</title>
<link rel="icon" href="/static/pwa/icons/icon-96.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #000080 0%, #00006a 55%, #000050 100%);
    color: #FFF9E5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  img {
    width: 84px;
    height: 84px;
    margin-bottom: 24px;
    filter: drop-shadow(0 2px 10px rgba(255,107,0,.45));
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 12px;
  }
  p {
    font-size: 0.95rem;
    color: rgba(255,249,229,0.75);
    max-width: 380px;
    line-height: 1.6;
    margin-bottom: 28px;
  }
  button {
    background: #FF6B00;
    color: #fff;
    border: none;
    padding: 12px 28px;
    border-radius: 24px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(255,107,0,.35);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(255,107,0,.5);
  }
</style>
</head>
<body>
  <img src="/static/pwa/icons/icon-192.png" alt="Mon Livreur Pro" onerror="this.style.display='none'">
  <h1>Pas de connexion internet</h1>
  <p>Cette page n'est pas disponible hors connexion. Vérifiez votre connexion internet puis réessayez.</p>
  <button onclick="window.location.reload()">Réessayer</button>
</body>
</html>

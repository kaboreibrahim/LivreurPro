{% load static %}
<style>
    .mlp-install-banner {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 16px;
        z-index: 1100;
        max-width: 480px;
        margin: 0 auto;
        display: none;
        align-items: center;
        gap: 14px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 10px 34px rgba(0,0,128,0.22);
        border: 1px solid rgba(0,0,128,0.08);
        padding: 14px 14px 14px 16px;
        animation: mlpInstallSlideUp .35s ease;
    }
    .mlp-install-banner.mlp-show { display: flex; }
    @keyframes mlpInstallSlideUp {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    .mlp-install-banner-icon img {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        flex-shrink: 0;
    }
    .mlp-install-banner-text {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
    }
    .mlp-install-banner-text strong {
        font-size: 0.92rem;
        color: #0d2559;
        font-family: inherit;
    }
    .mlp-install-banner-text span {
        font-size: 0.78rem;
        color: #6b7280;
        line-height: 1.35;
    }
    .mlp-install-banner-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
    }
    .mlp-install-btn {
        background: #FF6B00;
        color: #fff;
        border: none;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        transition: transform .2s ease, box-shadow .2s ease;
    }
    .mlp-install-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 14px rgba(255,107,0,.4);
    }
    .mlp-install-dismiss {
        background: transparent;
        border: none;
        color: #9ca3af;
        font-size: 1.3rem;
        line-height: 1;
        cursor: pointer;
        padding: 4px 6px;
    }
    .mlp-install-dismiss:hover { color: #4b5563; }
    .mlp-install-banner.mlp-ios .mlp-install-btn { display: none; }
    @media (max-width: 480px) {
        .mlp-install-banner { left: 10px; right: 10px; bottom: 76px; padding: 12px; }
    }
</style>
<div id="mlp-install-banner" class="mlp-install-banner" role="dialog" aria-label="Installer Mon Livreur Pro">
    <div class="mlp-install-banner-icon">
        <img src="{% static 'pwa/icons/icon-96.png' %}" alt="" aria-hidden="true">
    </div>
    <div class="mlp-install-banner-text">
        <strong>Installer l'application</strong>
        <span id="mlp-install-banner-msg">Accédez plus rapidement à Mon Livreur Pro depuis votre écran d'accueil.</span>
    </div>
    <div class="mlp-install-banner-actions">
        <button type="button" id="mlp-install-btn" class="mlp-install-btn">Installer</button>
        <button type="button" id="mlp-install-dismiss" class="mlp-install-dismiss" aria-label="Fermer">&times;</button>
    </div>
</div>
